apiVersion: batch/v1
kind: CronJob
metadata:
  name: healthchecks-heartbeat
  namespace: monitoring
  labels:
    app: healthchecks-heartbeat
    app.kubernetes.io/part-of: phoenix-platform
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: healthchecks-heartbeat
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ping
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  if [ -n "${HEALTHCHECKS_URL:-}" ]; then
                    curl -fsS -m 10 --retry 2 -o /dev/null "${HEALTHCHECKS_URL}"
                    echo "Heartbeat ping sent successfully."
                  else
                    echo "HEALTHCHECKS_URL not configured in secret monitoring-webhooks; heartbeat job completed."
                  fi
              env:
                - name: HEALTHCHECKS_URL
                  valueFrom:
                    secretKeyRef:
                      name: monitoring-webhooks
                      key: HEALTHCHECKS_URL
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                privileged: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
