apiVersion: v1
kind: ConfigMap
metadata:
  name: phoenix-slo-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  phoenix-platform-slos.json: |-
    {
      "title": "Phoenix Platform — 3 SLOs & K3s Health",
      "uid": "phoenix-platform-slos",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "SLO 1: Test API Availability (Target >= 99.5%)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "test_api:availability:ratio_rate5m * 100",
              "legendFormat": "Availability %"
            }
          ]
        },
        {
          "id": 2,
          "title": "SLO 2: Test API P99 Latency (Target < 300ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "targets": [
            {
              "expr": "test_api:latency_p99:seconds_rate5m * 1000",
              "legendFormat": "P99 Latency (ms)"
            }
          ]
        },
        {
          "id": 3,
          "title": "SLO 3: HTTP Requests by Status Code (2xx vs 5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{service=\"test-api\"}[1m]))",
              "legendFormat": "HTTP {{ status }}"
            }
          ]
        }
      ]
    }

