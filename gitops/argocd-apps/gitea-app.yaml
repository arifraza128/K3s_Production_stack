apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: "12.7.0"
    helm:
      values: |
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: true
          global:
            postgresql:
              auth:
                password: gitea-db-pass
        gitea:
          admin:
            username: gitea_admin
            password: admin12345
            email: admin@local
        persistence:
          enabled: true
          size: 5Gi
        service:
          http:
            type: NodePort
            nodePort: 30080
          ssh:
            type: NodePort
            nodePort: 30022
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
