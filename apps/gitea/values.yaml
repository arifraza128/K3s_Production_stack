# Gitea chart enables postgresql-ha and valkey-cluster by default — disable them
# and use the simpler non-HA postgresql subchart + in-memory cache for single-node K3s.
postgresql-ha:
  enabled: false

valkey-cluster:
  enabled: false

valkey:
  enabled: false

postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        password: gitea-db-pass

gitea:
  admin:
    username: gitea_admin
    password: admin12345
    email: admin@local
  config:
    cache:
      ADAPTER: memory
    session:
      PROVIDER: memory
    queue:
      TYPE: level

persistence:
  enabled: true
  size: 5Gi

service:
  http:
    type: NodePort
    nodePort: 30080
  ssh:
    type: NodePort
    nodePort: 30022
