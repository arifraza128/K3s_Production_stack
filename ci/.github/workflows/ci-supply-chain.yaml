name: "Phase 4 — CI/CD & Supply-Chain Security (Trivy + Syft SBOM + Cosign)"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/test-api/app.py"
      - "apps/test-api/test_app.py"
      - "apps/test-api/Dockerfile"
      - ".github/workflows/ci-supply-chain.yaml"
      - "ci/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: arifraza128/k3s_production_stack/test-api

permissions:
  contents: write
  packages: write
  id-token: write # Required for Sigstore Cosign keyless OIDC signing
  security-events: write

jobs:
  build-scan-sign:
    name: Build, Trivy Scan, Syft SBOM & Cosign Sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Test API unit tests
        run: python3 -m unittest discover -s apps/test-api -v

      - name: Set up QEMU (for ARM64 K3s Graviton support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for Trivy & Syft scanning
        uses: docker/build-push-action@v6
        with:
          context: ./apps/test-api
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner (Fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          scanners: "vuln"
          severity: "HIGH,CRITICAL"

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-test-api.cdx.json

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image (linux/arm64, linux/amd64)
        id: build-and-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/test-api
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign container image keyless with Cosign (OIDC)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          cosign attest --yes --predicate sbom-test-api.cdx.json --type cyclonedx "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"

      - name: Bump image tag in Kubernetes manifest (GitOps)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s|image: ghcr.io/.*/test-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" apps/test-api/k8s/deployment.yaml
          sed -i "s|value: \"[0-9a-f]\{7,40\}\"|value: \"${SHORT_SHA}\"|g" apps/test-api/k8s/deployment.yaml
          if ! git diff --quiet apps/test-api/k8s/deployment.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/test-api/k8s/deployment.yaml
            git commit -m "chore(gitops): bump test-api image to ${SHORT_SHA} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
