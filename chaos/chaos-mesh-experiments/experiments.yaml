apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: test-api-pod-kill
  namespace: default
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: test-api
  gracePeriod: 0
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: test-api-network-delay
  namespace: default
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: test-api
  delay:
    latency: "150ms"
    jitter: "20ms"
  duration: "60s"

