apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix-public-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    # API.md §1 & ARCHITECTURE.md §11: /slow, /fail, /crash are internal only and blocked publicly
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~ ^/(crash|fail|slow|metrics) {
        return 403 '{"error":{"code":"FORBIDDEN","message":"Internal endpoint not routable via public ingress","request_id":"ingress-deny"}}\n';
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 13.207.161.55.sslip.io
      secretName: phoenix-sslip-tls
  rules:
    - host: 13.207.161.55.sslip.io
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: test-api
                port:
                  number: 80
          - path: /version
            pathType: Exact
            backend:
              service:
                name: test-api
                port:
                  number: 80
          - path: /work
            pathType: Exact
            backend:
              service:
                name: test-api
                port:
                  number: 80
