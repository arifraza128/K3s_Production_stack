apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix-public-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    # Phase 6 Security Gate: Explicitly block /crash from external callers
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /crash {
        return 403 '{"error":"forbidden","message":"/crash endpoint is blocked publicly"}\n';
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 13.207.161.55.sslip.io
      secretName: phoenix-sslip-tls
  rules:
    - host: 13.207.161.55.sslip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: test-api
                port:
                  number: 80
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: test-api
                port:
                  number: 80
          - path: /fail
            pathType: Exact
            backend:
              service:
                name: test-api
                port:
                  number: 80

